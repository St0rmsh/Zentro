apiVersion: apps/v1
kind: Deployment
metadata:
  name: zentro-frontend
  labels:
    app: zentro-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zentro-frontend
  template:
    metadata:
      labels:
        app: zentro-frontend
    spec:
      containers:
        - name: zentro-frontend
          image: zentro-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: zentro-frontend-service
spec:
  selector:
    app: zentro-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP