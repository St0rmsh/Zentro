apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zentro-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zentro-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      # Avoid flapping under a load test's uneven traffic — wait 2 minutes
      # of sustained low usage before removing pods.
      stabilizationWindowSeconds: 120