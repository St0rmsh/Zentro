services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Built manually via build-images.ps1 (Docker Desktop's normal build-context
    # transfer has a Windows-specific bug on this project — see chat history).
    # Compose only runs the pre-built image here, it doesn't build it.
    image: zentro-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/zentro
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      # The Dockerized frontend runs on 8080, not the Vite dev server's 5173 —
      # both are allowed here so this works whether you're testing the
      # container or your normal local dev server.
      FRONTEND_ORIGINS: "http://localhost:8080,http://localhost:5173"
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    # Same as backend — built manually, Compose just runs it.
    image: zentro-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data: